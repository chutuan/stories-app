# ============================================================================
#  Chống thu thập hàng loạt
# ============================================================================
#
# Đặt ở đầu file vì `map` và `limit_req_zone` chỉ hợp lệ trong ngữ cảnh http{},
# mà file này được include vào bên trong http{}.
#
# BIẾT TRƯỚC GIỚI HẠN CỦA NÓ: chặn theo User-Agent chỉ ngăn được bot tự khai
# đúng tên. Kẻ nào đổi UA thành Chrome là đi qua ngay. Lớp này để loại những con
# đang thật sự đốt băng thông của site và những con AI có cam kết tuân thủ; lớp
# chặn theo dấu vết thật (TLS fingerprint, điểm bot) nằm ở Cloudflare, và hiện
# CHƯA bật vì bản ghi DNS đang ở chế độ DNS-only.

map $http_user_agent $blocked_agent {
    default 0;

    # Không khai tên. Mọi trình duyệt và mọi bot đứng đắn đều khai.
    ""                                  1;

    # Đang có trong log ngay lúc này: quét ảnh bìa và đào backlink để bán.
    "~*heritrix"                        1;
    "~*image-meta\.com"                 1;
    "~*ImageMetaBot"                    1;
    "~*serpstatbot"                     1;
    "~*vitesweep"                       1;
    "~*(AhrefsBot|SemrushBot|MJ12bot|DotBot|DataForSeoBot|BLEXBot|Barkrowler)"  1;

    # Máy quét lỗ hổng. Con đang gõ site này nhét thẳng URL khai thác WordPress
    # vào ô User-Agent, nên bắt theo dấu đó luôn.
    "~*(zgrab|masscan|nmap|Nuclei|sqlmap)"   1;
    "~*wp-(admin|login|content)"        1;

    # Công cụ tải trọn site về máy.
    "~*(HTTrack|WebCopier|Offline Explorer|WebZIP|Teleport)"  1;

    # Bot thu thập dữ liệu huấn luyện AI. robots.txt đã yêu cầu chúng tránh ra;
    # đây là lớp thứ hai cho những con phớt lờ yêu cầu đó.
    #
    # KHÔNG có Google-Extended và Applebot-Extended ở đây: hai mã đó chỉ tồn tại
    # trong robots.txt, không có chuỗi UA nào như vậy đi trên đường truyền. Chặn
    # chúng ở tầng này là chặn vào chỗ trống — mà tệ hơn, ai đọc file sau này sẽ
    # tưởng việc đó đã xong.
    "~*(GPTBot|OAI-SearchBot|ChatGPT-User)"     1;
    "~*(ClaudeBot|Claude-Web|anthropic-ai)"     1;
    "~*(CCBot|Bytespider|Bytedance)"            1;
    "~*(PerplexityBot|Amazonbot|YouBot)"        1;
    "~*(meta-externalagent|FacebookBot)"        1;
    "~*(Omgilibot|Diffbot|ImagesiftBot|Timpibot|Webzio)"  1;
    "~*Applebot-Extended"                       1;
}

# Bot phải được vào tự do, miễn giới hạn tốc độ.
#
# Khoá rỗng nghĩa là "không tính vào zone". Googlebot quét nhanh theo thiết kế,
# bóp nó lại là tự làm chậm việc index chính mình. Mediapartners-Google thì bắt
# buộc phải vào được MỌI trang: bị bóp thì AdSense không trả lỗi, nó chỉ hiện ô
# quảng cáo trống.
map $http_user_agent $throttle_key {
    default                             $binary_remote_addr;
    "~*(Googlebot|AdsBot-Google|Mediapartners-Google|Google-InspectionTool)"  "";
    "~*(bingbot|BingPreview|DuckDuckBot|YandexBot|Applebot)"                  "";
    "~*(facebookexternalhit|Facebot|Twitterbot|LinkedInBot|Slackbot|WhatsApp|TelegramBot|Discordbot)"  "";
}

# 2 request/giây, cho phép dồn 40 cái liền nhau.
#
# Nới tay có chủ ý. Mạng di động Việt Nam dùng NAT rất nhiều — hàng chục người
# đọc thật có thể cùng chung một địa chỉ IP, nên siết chặt là chặn người đọc chứ
# không chặn bot. Và phải nói thẳng: site chỉ có ~103 URL, nên giới hạn tốc độ
# KHÔNG cứu được nội dung — kẻ nào muốn lấy hết vẫn lấy xong trong hai phút.
# Tác dụng thật của nó là chặn kiểu gõ 242 lượt liên tục như con heritrix, và
# giữ cho php-fpm không bị một script làm ngộp.
limit_req_zone $throttle_key zone=pages:10m rate=120r/m;
limit_req_status 429;

server {
    server_name tunastory.com;

    root /var/www/stories/backend/public;
    index index.php;
    charset utf-8;

    # Admin upload MP3 cho chương truyện
    client_max_body_size 120M;

    # Front controller không được lộ ra ngoài: /index.php/story/x trả 200 kèm
    # canonical tự trỏ, tức nguyên site có thêm một bản sao thứ ba. Dùng
    # $request_uri (URI GỐC của request) nên phép kiểm này chỉ chạy một lần ở đầu
    # request — các lần rewrite nội bộ về /index.php của try_files không kích hoạt
    # lại, nếu không site sẽ tự chuyển hướng vòng tròn.
    if ($request_uri ~ ^/index\.php(/.*)?$) { return 301 https://tunastory.com$1; }

    # Bot trong danh sách chặn ở đầu file. 403 chứ không phải 429: 429 nghĩa là
    # "quay lại sau", tức mời nó thử lại mãi.
    if ($blocked_agent) { return 403; }

    # Lời tuyên bố "đừng dùng nội dung này để huấn luyện AI" dưới dạng header.
    # Gần như không hãng nào tuân thủ — nó chỉ có giá trị làm bằng chứng là chúng
    # tôi đã nói rõ ý mình, cho lần cần đến luật. Đừng coi đây là lớp bảo vệ.
    add_header X-Robots-Tag "noai, noimageai" always;

    location / {
        # Chỉ bóp trang HTML. Nếu đặt ở tầng server thì một trang /browse tải 20
        # ảnh bìa cùng lúc sẽ tự đốt hết hạn mức của chính người đọc đó.
        limit_req zone=pages burst=40 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 120s;
    }

    # Ảnh bìa + audio: URL đã có ?v=<mtime> nên cache dài thoải mái
    location ^~ /storage/ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    # Cache ngắn có chủ ý: mặc định Cloudflare gán max-age=14400 cho robots.txt,
    # nghĩa là sửa file xong phải chờ 4 tiếng hoặc vào purge tay mới thấy đổi.
    location = /robots.txt  {
        access_log off; log_not_found off;
        add_header Cache-Control "public, max-age=300";
    }

    # Chặn lộ file nhạy cảm
    location ~ /\.(?!well-known).* { deny all; }

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 512;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tunastory.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tunastory.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

# --- api.tunastory.com ---
#
# Trước đây MỘT server block phục vụ cả hai tên miền, nên nguyên trang web công
# khai tồn tại hai bản index được: 103 URL x 2 host = 206 bản, thân bài giống hệt
# nhau tới từng byte, và mỗi host tự trỏ rel=canonical về CHÍNH NÓ. Không host nào
# nhường host nào nên Google buộc phải tự chọn bản chuẩn — có thể chọn api và làm
# tên miền chính mất trắng thứ hạng.
#
# Không sửa được ở tầng Laravel: url() và route() luôn nội suy theo host của
# request, còn URL::forceRootUrl() sẽ làm hỏng link trang /admin vốn nằm trên host
# này. Nên chặn ở đây.
#
# GIỮ 200 cho /storage (trang chính nhúng ảnh bìa trực tiếp từ host này — chuyển
# hướng là vỡ ảnh toàn site), /api (ứng dụng di động đang chờ Apple duyệt), /admin,
# /up (deploy.sh dùng để health check) và /.well-known (certbot gia hạn chứng chỉ).
server {
    server_name api.tunastory.com;
    root /var/www/stories/backend/public;
    index index.php;
    charset utf-8;
    client_max_body_size 120M;

    # Host phụ: chặn thu thập, TRỪ ảnh bìa.
    #
    # Ảnh bìa của mọi truyện nhúng từ host này (`<img src="https://api.../storage/
    # stories/x.jpg">`), nên `Disallow: /` trọn gói đồng nghĩa Googlebot-Image không
    # bao giờ lấy được ảnh nào — thư viện vắng mặt hoàn toàn khỏi Google Images.
    #
    # ĐỘ DÀI LUẬT LÀ CHỦ Ý, không phải viết dài cho đẹp. Cloudflare CHÈN robots.txt
    # quản lý của nó vào trước file này, trong đó có `User-agent: * / Allow: /`.
    # Hai nhóm cùng `*` bị gộp làm một, và khi hai luật khớp cùng độ dài thì Google
    # cho `Allow` thắng — nên `Disallow: /` (1 ký tự) hoà với `Allow: /` và THUA.
    # Đó là lý do mỗi đường dẫn nhạy cảm phải có luật riêng dài hơn 1 ký tự mới
    # thắng được. Kiểm lại bằng parser thật sau mỗi lần sửa, đừng đọc bằng mắt.
    #
    # /storage/audio/ vẫn chặn: 49 file MP3 là trọn vẹn chương có giọng đọc, đưa
    # vào chỉ mục chỉ tổ để người ta tải thẳng từ trang kết quả tìm kiếm, không
    # đem lại thứ hạng nào.
    location = /robots.txt {
        add_header Content-Type text/plain;
        add_header Cache-Control "public, max-age=300";
        return 200 "User-agent: *\nAllow: /storage/stories/\nAllow: /storage/og/\nDisallow: /storage/audio/\nDisallow: /api/\nDisallow: /admin\nDisallow: /up\nDisallow: /\n";
    }

    location ^~ /storage/ {
        # Mở /storage/stories/ cho Googlebot-Image trong robots.txt thì phải có thứ
        # giữ con heritrix của image-meta.com ở ngoài — nó đã quét 242 lượt chỉ để
        # thu ảnh bìa, và nó không đọc robots.txt.
        #
        # Chỉ đặt trong location NÀY chứ không đặt ở tầng server như bên
        # tunastory.com: block này còn phục vụ /api/ cho app iOS ĐANG CHỜ APPLE
        # DUYỆT, và một luật chặn quá tay ở đây là app hỏng với người dùng thật.
        if ($blocked_agent) { return 403; }

        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ^~ /api/    { try_files $uri $uri/ /index.php?$query_string; }
    location ^~ /admin   { try_files $uri $uri/ /index.php?$query_string; }
    location = /up       { try_files $uri $uri/ /index.php?$query_string; }
    location ^~ /.well-known/ { try_files $uri =404; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 120s;
    }

    location ~ /\.(?!well-known).* { deny all; }

    # Mọi thứ còn lại là trang HTML công khai -> nhường cho tên miền chính.
    location / { return 301 https://tunastory.com$request_uri; }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/tunastory.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tunastory.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = api.tunastory.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = tunastory.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name tunastory.com api.tunastory.com;
    return 404; # managed by Certbot




}