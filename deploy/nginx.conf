# =============================================================================
# Stories — nginx server block (Laravel 12 + PHP-FPM 8.2)
# =============================================================================
#
# Cài đặt:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/stories
#   sudo sed -i 's/stories\.example\.com/DOMAIN-THAT-CUA-BAN/g' /etc/nginx/sites-available/stories
#   sudo sed -i 's#/var/www/stories/backend#DUONG-DAN-THAT#g'   /etc/nginx/sites-available/stories
#   sudo ln -sfn /etc/nginx/sites-available/stories /etc/nginx/sites-enabled/stories
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo mkdir -p /var/www/certbot
#   sudo nginx -t && sudo systemctl reload nginx
#
# HAI PLACEHOLDER PHẢI THAY:
#   tunastory.com        -> domain thật (đã trỏ A record về IP của VPS)
#   /var/www/stories/backend   -> thư mục backend Laravel trên VPS (chứa artisan)
#
# -----------------------------------------------------------------------------
# BẮT BUỘC CÓ HTTPS
# -----------------------------------------------------------------------------
# iOS chặn HTTP thường bằng App Transport Security (ATS). App Expo/React Native
# gọi API qua http:// sẽ bị hệ điều hành CHẶN, không phải lỗi mạng, và không có
# cách vá phía JS. Vì vậy API production BẮT BUỘC chạy https://.
# Chỉ dùng block HTTP dưới đây trong lúc cài đặt ban đầu; xong bước certbot là
# toàn bộ traffic phải chuyển sang 443.
#
# -----------------------------------------------------------------------------
# QUY TRÌNH 2 GIAI ĐOẠN
# -----------------------------------------------------------------------------
# GIAI ĐOẠN 1 (file này khi vừa copy vào): chỉ có block :80, phục vụ app qua HTTP
#   -> dùng để kiểm tra nginx + php-fpm đã chạy đúng trước khi lo TLS.
#
# GIAI ĐOẠN 2 — lấy chứng chỉ và bật HTTPS. Cách dễ nhất (certbot tự sửa file này,
# tự tạo block 443 và tự thêm redirect 80 -> 443):
#
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d tunastory.com -d www.tunastory.com -d api.tunastory.com --redirect \
#        --agree-tos -m admin@tunastory.com --no-eff-email
#
# Nếu muốn tự làm tay (certonly + webroot) thì xem block 443 mẫu ở CUỐI FILE:
#   sudo certbot certonly --webroot -w /var/www/certbot -d tunastory.com -d www.tunastory.com -d api.tunastory.com
#   ... rồi bỏ comment block 443, và trong block :80 đổi `location /` thành redirect.
#
# Gia hạn tự động: gói certbot của Ubuntu đã cài sẵn systemd timer.
#   systemctl status certbot.timer
# =============================================================================


server {
    listen 80;
    listen [::]:80;
    server_name tunastory.com www.tunastory.com api.tunastory.com;

    # --- ACME HTTP-01 challenge (certbot --webroot) --------------------------
    # Đặt ^~ để luôn thắng các location regex bên dưới. Giữ nguyên cả sau khi đã
    # bật HTTPS: certbot cần đường này mỗi lần gia hạn chứng chỉ.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # === GIAI ĐOẠN 2: bỏ comment 3 dòng dưới, và XOÁ/COMMENT toàn bộ phần
    # "CẤU HÌNH ỨNG DỤNG" phía dưới trong block :80 này (nó đã được lặp lại
    # trong block 443 ở cuối file). Nếu chạy `certbot --nginx --redirect` thì
    # certbot làm hộ bước này, không cần sửa tay.
    #
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # ------------------------------------------------------------------------
    # CẤU HÌNH ỨNG DỤNG (Laravel)
    # ------------------------------------------------------------------------
    root /var/www/stories/backend/public;
    index index.php;
    charset utf-8;

    server_tokens off;

    access_log /var/log/nginx/stories.access.log;
    error_log  /var/log/nginx/stories.error.log warn;

    # Admin upload file MP3 cho chương. Validate phía Laravel là max:102400 KB
    # (100 MB) — xem app/Http/Controllers/Admin/ChapterController.php.
    # Để dư 120M cho phần multipart overhead. php.ini phải >= mức này
    # (upload_max_filesize + post_max_size), nếu không nginx cho qua mà PHP chặn.
    client_max_body_size 120M;
    client_body_timeout 300s;

    # Nén JSON của API (ảnh JPG và MP3 đã nén sẵn, không gzip lại).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain text/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # --- File media sinh ra lúc chạy: ảnh bìa + audio TTS ---------------------
    # public/storage là symlink -> storage/app/public (tạo bởi `artisan storage:link`).
    # URL do App\Support\PublicFileUrl dựng, luôn kèm ?v=<mtime>, nên nội dung ứng
    # với một URL là BẤT BIẾN: file đổi -> mtime đổi -> query string đổi -> cache miss.
    # Vì vậy cache được rất dài mà không sợ client giữ file cũ.
    location ^~ /storage/ {
        access_log off;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;

        # File MP3 dài: expo-audio phát theo Range request. nginx hỗ trợ sẵn
        # Accept-Ranges cho file tĩnh, chỉ cần không bật gzip cho nhánh này.
        gzip off;

        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        fastcgi_param HTTPS           $https if_not_empty;

        fastcgi_hide_header X-Powered-By;

        # Sinh giọng đọc AI KHÔNG chạy trong request: nút bấm trong admin chỉ
        # dispatch App\Jobs\GenerateChapterAudio vào hàng đợi rồi trả về ngay,
        # queue worker mới là chỗ gọi OpenAI. Nên KHÔNG cần timeout hàng nghìn giây
        # ở tầng web nữa.
        # 300s ở đây là để phục vụ việc admin upload file MP3 tới 100 MB: PHP còn
        # phải nhận hết body rồi ghi file vào storage/, trên đường truyền chậm việc
        # này lâu hơn mặc định 60s khá nhiều.
        # Giữ khớp với /etc/php/8.2/fpm/pool.d/www.conf -> request_terminate_timeout
        # và php.ini -> max_execution_time.
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;

        fastcgi_buffer_size 16k;
        fastcgi_buffers 16 16k;
    }

    # Chỉ index.php được thực thi. Mọi .php khác -> 404, chặn kiểu tấn công
    # ghi file .php vào thư mục upload rồi gọi thẳng.
    location ~ \.php$ {
        return 404;
    }

    # Chặn mọi file/thư mục ẩn: .env, .git, .htaccess, .user.ini ...
    # (chừa .well-known cho certbot). Thực tế .env và .git nằm NGOÀI document
    # root nên đã không truy cập được; đây là lớp phòng thủ thứ hai, phòng khi
    # ai đó đặt sai root hoặc lỡ copy .env vào public/.
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Chặn tường minh cho dễ đọc khi review cấu hình.
    location ~* /(?:\.env|\.env\..*|\.git|composer\.(?:json|lock)|package\.json|artisan)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    error_page 404 /index.php;
}


