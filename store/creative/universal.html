<!doctype html>
<!--
  Creative asset "universal" 16:9 cho App Store (Header + Search Results), iOS 27+.
  Xuất ra 5244x2950 PNG bằng: bash store/creative/render.sh
  Mở file kèm #guides để thấy hai vùng cắt: 21:9 (header, cắt trên/dưới) và 3:2
  (search results, cắt hai bên). Chữ và máy phải nằm trong phần giao của hai vùng.
  Luật của Apple: không giá/giảm giá, không URL, không ©, không logo nền tảng khác,
  nội dung phải đạt mức 4+ (kể cả bìa truyện), không có kênh alpha.
-->
<html>
<head>
<meta charset="utf-8">
<title>Stories universal asset</title>
<style>
  :root { --ink: #1A1614; --muted: #6E635C; --accent: #FF9052; --accent-deep: #F2703A; --bg: #FDF8F4; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 2622px; height: 1475px; overflow: hidden; }
  body {
    position: relative;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(1000px 820px at 1900px 760px, rgba(255, 144, 82, .40), rgba(255, 144, 82, 0) 72%),
      radial-gradient(1300px 900px at 260px 80px, #FFE6D2, rgba(255, 230, 210, 0) 70%),
      linear-gradient(135deg, #FFF2E6 0%, var(--bg) 46%, #FBE6D5 100%);
  }

  .copy {
    position: absolute; left: 300px; top: 0; bottom: 0; width: 1040px;
    display: flex; flex-direction: column; justify-content: center;
  }
  h1 { font-size: 150px; line-height: 1.0; font-weight: 800; letter-spacing: -4px; }
  h1 em {
    font-style: normal;
    background: linear-gradient(100deg, var(--accent), var(--accent-deep));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .copy p { margin-top: 48px; font-size: 60px; line-height: 1.3; font-weight: 500; color: var(--muted); max-width: 1000px; }

  .phone {
    position: absolute; width: 491px; padding: 18px; border-radius: 96px;
    background: #1C1714;
    box-shadow: 0 70px 130px rgba(140, 60, 15, .30), 0 22px 44px rgba(26, 22, 20, .20), inset 0 0 0 3px #3A322D;
  }
  .phone img { display: block; width: 100%; border-radius: 78px; }
  .phone.back { left: 1400px; top: 236px; transform: rotate(-7deg) scale(.93); }
  .phone.front { left: 1840px; top: 225px; }

  .guides { display: none; position: absolute; inset: 0; pointer-events: none; }
  .guides div { position: absolute; border: 4px dashed rgba(0, 120, 255, .9); }
  :target.guides, .show-guides .guides { display: block; }
</style>
</head>
<body>
  <div class="copy">
    <h1>Your next<br>chapter is<br><em>waiting.</em></h1>
    <p>Read it yourself, or sit back and listen.</p>
  </div>

  <div class="phone back"><img src="../screenshots/ios-6.9/2-detail.png" alt=""></div>
  <div class="phone front"><img src="../screenshots/ios-6.9/5-audio.png" alt=""></div>

  <div class="guides" id="guides">
    <!-- 21:9 giữ nguyên chiều ngang, cắt 175.5px trên/dưới; 3:2 giữ chiều cao, cắt 204.75px hai bên -->
    <div style="left:0; right:0; top:175.5px; bottom:175.5px"></div>
    <div style="left:204.75px; right:204.75px; top:0; bottom:0; border-color: rgba(255, 0, 120, .9)"></div>
  </div>
</body>
</html>
