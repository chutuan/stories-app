<!doctype html>
<!--
  Ảnh "sản phẩm" cho chiến dịch Demand Gen (Google Ads) của app iOS.
  Xuất: bash store/creative/google-ads/render.sh
  Luật Demand Gen/Discover: KHÔNG chữ chèn đè, KHÔNG logo đè, KHÔNG nút giả ("Download"), KHÔNG huy hiệu
  App Store. Chữ duy nhất là giao diện app thật bên trong màn hình điện thoại.
  Bố cục theo ?layout=landscape (1200x628) | square (1200x1200) | portrait (960x1200).
-->
<html>
<head>
<meta charset="utf-8">
<title>Stories app phones</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: var(--w); height: var(--h); overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(60% 70% at 50% 58%, rgba(255, 144, 82, .55), rgba(255, 144, 82, 0) 70%),
      radial-gradient(45% 50% at 12% 8%, #FFE3CC, rgba(255, 227, 204, 0) 70%),
      radial-gradient(45% 50% at 92% 96%, #F9C9A6, rgba(249, 201, 166, 0) 70%),
      linear-gradient(140deg, #FFF3E8 0%, #FDF6F0 45%, #FBE2CF 100%);
  }
  .phone {
    position: absolute;
    width: var(--pw);
    aspect-ratio: 1320 / 2868;
    padding: calc(var(--pw) * .032);
    border-radius: calc(var(--pw) * .16);
    background: linear-gradient(145deg, #3a3634, #0f0d0c 40%, #26221f);
    box-shadow:
      0 calc(var(--pw) * .09) calc(var(--pw) * .16) rgba(120, 50, 10, .32),
      0 calc(var(--pw) * .02) calc(var(--pw) * .04) rgba(26, 22, 20, .30),
      inset 0 0 0 calc(var(--pw) * .006) rgba(255, 255, 255, .18);
  }
  .phone img {
    display: block; width: 100%; height: 100%; object-fit: cover; object-position: top;
    border-radius: calc(var(--pw) * .13);
  }
  .left  { z-index: 1; }
  .mid   { z-index: 3; }
  .right { z-index: 2; }
</style>
</head>
<body>
  <!-- Không dùng src/reader.png: màn đọc có ô "Advertisement" ở trên, đặt trong ảnh quảng cáo trông kỳ. -->
  <div class="phone left"><img src="src/detail.png" alt=""></div>
  <div class="phone mid"><img src="src/discover.png" alt=""></div>
  <div class="phone right"><img src="src/audio.png" alt=""></div>
<script>
  // Mỗi bố cục: kích thước khung, độ rộng điện thoại giữa/hai bên, vị trí và góc nghiêng.
  const L = {
    landscape: { w: 1200, h: 628, mid: 252, side: 226,
      pos: { left: [290, 74, -7], mid: [474, 40, 0], right: [684, 74, 7] } },
    square:    { w: 1200, h: 1200, mid: 450, side: 398,
      pos: { left: [182, 168, -8], mid: [375, 92, 0], right: [626, 168, 8] } },
    portrait:  { w: 960, h: 1200, mid: 448, side: 370,
      pos: { left: [90, 204, -8], mid: [256, 112, 0], right: [500, 204, 8] } },
  };
  const k = new URLSearchParams(location.search).get('layout') || 'square';
  const c = L[k];
  document.documentElement.style.setProperty('--w', c.w + 'px');
  document.documentElement.style.setProperty('--h', c.h + 'px');
  for (const [cls, [x, y, deg]] of Object.entries(c.pos)) {
    const el = document.querySelector('.' + cls);
    el.style.setProperty('--pw', (cls === 'mid' ? c.mid : c.side) + 'px');
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.transform = `rotate(${deg}deg)`;
  }
</script>
</body>
</html>
